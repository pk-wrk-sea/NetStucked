name: Windows build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check paramiko==4.0.0
      - name: Verify fragmented console line framing
        run: python -m unittest discover -s tests/fixtures -p test_console_input.py
      - run: dotnet restore NetStucked.sln
      - run: dotnet build NetStucked.sln -c Release --no-restore
      - run: dotnet test NetStucked.sln -c Release --no-build --logger trx
      - run: dotnet run --project tests/NetStucked.WindowsQa -c Release --no-build -- artifacts/windows-qa 0
      - name: Verify owned SSH collector host keys, fallback, streaming and cancellation
        run: dotnet tests/NetStucked.WindowsQa/bin/Release/net10.0-windows/NetStucked.WindowsQa.dll --collector-ssh-check artifacts/collector-ssh-qa tests/fixtures/collector_ssh_server.py
      - name: Verify Collector Cisco-compatible SSH and drained cancellation
        run: dotnet tests/NetStucked.WindowsQa/bin/Release/net10.0-windows/NetStucked.WindowsQa.dll --collector-cisco-ssh-check artifacts/collector-cisco-ssh-qa tests/fixtures/collector_ssh_compat_server.py
      - name: Verify bundled Netmiko, five owned drivers, trust, cancellation and parallel jobs
        run: dotnet tests/NetStucked.WindowsQa/bin/Release/net10.0-windows/NetStucked.WindowsQa.dll --netmiko-check artifacts/netmiko-qa tests/fixtures/netmiko_devices.py
      - name: Verify actual Collector and Inventory WPF workflows
        run: dotnet tests/NetStucked.WindowsQa/bin/Release/net10.0-windows/NetStucked.WindowsQa.dll --collector-revision-ui-check artifacts/collector-revision-qa tests/fixtures/netmiko_devices.py
      - name: Verify integrated engineering menus with owned offline fixtures
        run: dotnet tests/NetStucked.WindowsQa/bin/Release/net10.0-windows/NetStucked.WindowsQa.dll --engineering-ui-check artifacts/engineering-qa
      - name: Verify CVE expiry and editor preservation without external providers
        run: dotnet tests/NetStucked.WindowsQa/bin/Release/net10.0-windows/NetStucked.WindowsQa.dll --cve-regression-check artifacts/cve-regression-qa
      - name: Verify Collector banners through owned SSH
        run: dotnet tests/NetStucked.WindowsQa/bin/Release/net10.0-windows/NetStucked.WindowsQa.dll --collector-banner-ssh-check artifacts/collector-banner-qa tests/fixtures/collector_cisco_lab_server.py
      - name: Verify actual Collector WPF with CTR and strict console Enter
        env:
          NETSTUCKED_QA_SSH_CTR: '1'
        run: dotnet tests/NetStucked.WindowsQa/bin/Release/net10.0-windows/NetStucked.WindowsQa.dll --collector-real-ui-check artifacts/collector-real-ctr-qa tests/fixtures/collector_cisco_lab_server.py
      - run: dotnet publish src/NetStucked.Desktop/NetStucked.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish/win-x64
      - name: Verify native monitoring auto-resume and profile instance restoration
        run: dotnet tests/NetStucked.WindowsQa/bin/Release/net10.0-windows/NetStucked.WindowsQa.dll --native-monitor-check artifacts/native-monitor-qa artifacts/publish/win-x64/NetStucked.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NetStucked-win-x64
          path: artifacts/publish/win-x64
